[build-system]
requires = ["scikit-build-core>=0.5", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cones"
version = "0.2.0"
description = "CoNES: Coupled Nonlinear Equation Solver"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ajbenjam" }
]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "nanobind>=2.0"
]

[tool.scikit-build]
cmake.minimum-version = "3.15"
sdist.include = ["Eigen/**/*"]
