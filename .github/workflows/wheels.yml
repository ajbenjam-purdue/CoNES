name: Build and Release Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Build wheels for Windows, Linux, and macOS
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # In case submodules are added in the future

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # We can configure cibuildwheel options via environment variables
        env:
          # Build CPython 3.9 to 3.13 (nanobind requires Python 3.9+)
          CIBW_SKIP: "pp* cp36* cp37* cp38*"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist --outdir dist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-sdist
          path: dist/*.tar.gz

  build_cli:
    name: Build CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCONES_BUILD_PYTHON=OFF

      - name: Build CLI executable
        run: cmake --build build --config Release --target cnes

      - name: Package CLI (Windows)
        if: matrix.os == 'windows-latest'
        run: compress-archive -path build/Release/cnes.exe -destinationpath cnes-windows.zip

      - name: Package CLI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar -czvf cnes-linux.tar.gz -C build cnes

      - name: Package CLI (macOS)
        if: matrix.os == 'macos-latest'
        run: zip -j cnes-macos.zip build/cnes

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: |
            cnes-windows.zip
            cnes-linux.tar.gz
            cnes-macos.zip

  release:
    name: Release Assets
    needs: [build_wheels, build_sdist, build_cli]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
