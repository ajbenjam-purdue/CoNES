name: Build and Release Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Build wheels for Windows, Linux, and macOS
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # In case submodules are added in the future

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # We can configure cibuildwheel options via environment variables
        env:
          # Build CPython 3.11 to 3.13 (modern versions), skip 32-bit and musl targets
          CIBW_SKIP: "pp* cp36* cp37* cp38* cp39* cp310* *-manylinux_i686 *-musllinux_*"
          # Target macOS 13.3+ to ensure std::to_chars is available for std::format
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.3"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # Use manylinux_2_28 to support GCC 13 toolchain for std::format
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: "dnf install -y gcc-toolset-13"
          CIBW_ENVIRONMENT_LINUX: "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist --outdir dist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-sdist
          path: dist/*.tar.gz

  build_cli:
    name: Build CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CoolProp and export materials
        run: |
          pip install coolprop
          python tools/export_props.py

      - name: Install GCC 13 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCONES_BUILD_PYTHON=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build CLI executable
        run: cmake --build build --config Release --target cnes

      - name: Package CLI (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir cnes_dist
          copy build/Release/cnes.exe cnes_dist/
          copy -Recurse tools cnes_dist/tools
          copy -Recurse cones_studio cnes_dist/cones_studio
          copy -Recurse materials cnes_dist/materials
          copy LICENSE cnes_dist/
          copy README.md cnes_dist/
          compress-archive -path cnes_dist/* -destinationpath cnes-windows.zip

      - name: Package CLI (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir cnes_dist
          cp build/cnes cnes_dist/
          cp -r tools cnes_dist/tools
          cp -r cones_studio cnes_dist/cones_studio
          cp -r materials cnes_dist/materials
          cp LICENSE README.md cnes_dist/
          tar -czvf cnes-linux.tar.gz -C cnes_dist .

      - name: Package CLI (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir cnes_dist
          cp build/cnes cnes_dist/
          cp -r tools cnes_dist/tools
          cp -r cones_studio cnes_dist/cones_studio
          cp -r materials cnes_dist/materials
          cp LICENSE README.md cnes_dist/
          cd cnes_dist && zip -r ../cnes-macos.zip . && cd ..

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: |
            cnes-*



  release:
    name: Release Assets
    needs: [build_wheels, build_sdist, build_cli]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
